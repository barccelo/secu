name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECU_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Prepare persistent signing key
        env:
          SECU_SIGNING_BUNDLE_BASE64: ${{ secrets.SECU_SIGNING_BUNDLE_BASE64 }}
        run: |
          if [ -z "$SECU_SIGNING_BUNDLE_BASE64" ]; then
            echo "::error::Missing repository secret SECU_SIGNING_BUNDLE_BASE64."
            echo "::error::Secu refuses to build an installable APK with a temporary signing key."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/secu-signing"
          mkdir -p "$SIGNING_DIR"
          printf "%s" "$SECU_SIGNING_BUNDLE_BASE64" | base64 --decode > "$SIGNING_DIR/bundle.tar.gz"
          tar -xzf "$SIGNING_DIR/bundle.tar.gz" -C "$SIGNING_DIR"

          test -s "$SIGNING_DIR/secu-upload.jks"
          test -s "$SIGNING_DIR/signing.properties"

          echo "SECU_KEYSTORE_PATH=$SIGNING_DIR/secu-upload.jks" >> "$GITHUB_ENV"
          echo "SECU_SIGNING_PROPERTIES=$SIGNING_DIR/signing.properties" >> "$GITHUB_ENV"

      - name: Validate signing key
        run: |
          STORE_PASS="$(sed -n 's/^storePassword=//p' "$SECU_SIGNING_PROPERTIES")"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$SECU_SIGNING_PROPERTIES")"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          keytool -list \
            -keystore "$SECU_KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: secu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
